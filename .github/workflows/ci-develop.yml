name: ci-develop.yml
on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]
env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ${{github.repository}}

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            services: ${{steps.filter.outputs.changes}}
        steps:
            - uses: actions/checkout@v4

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                filters: |
                  analytic-service:
                    - 'services/analytic-service/**'
                    - 'config/analytic-service-**.yaml'
                  cart-service:
                    - 'services/cart-service/**'
                    - 'config/cart-service-**.yaml'
                  category-service:
                    - 'services/category-service/**'
                    - 'config/category-service-**.yaml'
                  gateway:
                    - 'services/gateway/**'
                    - 'config/gateway-**.yaml'
                  inventory-service:
                    - 'services/inventory-service/**'
                    - 'config/inventory-service-**.yaml'
                  notification-service:
                    - 'services/notification-service/**'
                    - 'config/notification-service-**.yaml'
                  order-service:
                    - 'services/order-service/**'
                    - 'config/order-service-**.yaml'
                  payment-service:
                    - 'services/payment-service/**'
                    - 'config/payment-service-**.yaml'
                  product-service:
                    - 'services/product-service/**'
                    - 'config/product-service-**.yaml'
                  review-server:
                    - 'services/review-service/**'
                    - 'config/review-service-**.yaml'
                  saga-service:
                    - 'services/saga-service/**'
                    - 'config/saga-service-**.yaml'
                  user-service:
                    - 'services/user-service/**'
                    - 'config/user-service-**.yaml'
                  common-exception:
                    - 'libraries/common-exception/**'
                  common-security:
                    - 'libraries/common-security/**'
                  common-utils:
                    - 'libraries/common-utils/**'
                  kafka-keycloak-spi:
                    - 'libraries/kafka-keycloak-spi/**'
                  all:
                    - 'libraries/**'
                    - '.github/workflows/**'
                    - 'pom.xml'
                    - 'config/application-**.yaml'

    build-and-test:
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.services != '[]'
        strategy:
            matrix:
                include:
                    - name: analytic-service
                      context: ./services/analytic-service

                    - name: cart-service
                      context: ./services/cart-service

                    - name: category-service
                      context: ./services/category-service

                    - name: gateway
                      context: ./services/gateway

                    - name: inventory-service
                      context: ./services/inventory-service

                    - name: notification-service
                      context: ./services/notification-service

                    - name: order-service
                      context: ./services/order-service

                    - name: payment-service
                      context: ./services/payment-service

                    - name: product-service
                      context: ./services/product-service

                    - name: review-service
                      context: ./services/review-service

                    - name: saga-service
                      context: ./services/saga-service

                    - name: user-service
                      context: ./services/user-service

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Install parent POM
              working-directory: .
              run: mvn clean install -DskipTests -pl pom.xml -N

            - name: Build libraries
              run: |
                  mvn clean install -DskipTests -pl libraries/common-utils
                  mvn clean install -DskipTests -pl libraries/common-security
                  mvn clean install -DskipTests -pl libraries/common-exception
                  mvn clean install -DskipTests -pl libraries/kafka-keycloak-spi

            - name: Build and Test ${{matrix.name}}
              if: contains(needs.detect-changes.outputs.services, matrix.name) || contains(needs.detect-changes.outputs.services, 'all')
              working-directory: ${{ matrix.context }}
              run: |
                  mvn clean test
                  mvn package -DskipTests

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}-jar
                  path: ${{ matrix.context }}/target/*.jar
                  retention-days: 1

    build-keycloak-spi:
        runs-on: ubuntu-latest
        needs: detect-changes
        if: |
            contains(needs.detect-changes.outputs.services, 'kafka-keycloak-spi') ||
            contains(needs.detect-changes.outputs.services, 'keycloak') ||
            contains(needs.detect-changes.outputs.services, 'all')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Install Parent POM
              run: mvn clean install -DskipTests -pl pom.xml -N

            - name: Build dependencies
              run: |
                  mvn clean install -DskipTests -pl libraries/common-utils
                  mvn clean install -DskipTests -pl libraries/common-security
                  mvn clean install -DskipTests -pl libraries/common-exception

            - name: Build Keycloak SPI
              working-directory: ./libraries/kafka-keycloak-spi
              run: mvn clean package -DskipTests

            - name: Upload SPI artifact
              uses: actions/upload-artifact@v4
              with:
                  name: keycloak-spi-jar
                  path: ./libraries/kafka-keycloak-spi/target/*.jar

    build-and-push-images:
        runs-on: ubuntu-latest
        needs:
            - detect-changes
            - build-and-test
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - name: analytic-service
                      context: ./services/analytic-service

                    - name: cart-service
                      context: ./services/cart-service

                    - name: category-service
                      context: ./services/category-service

                    - name: gateway
                      context: ./services/gateway

                    - name: inventory-service
                      context: ./services/inventory-service

                    - name: notification-service
                      context: ./services/notification-service

                    - name: order-service
                      context: ./services/order-service

                    - name: payment-service
                      context: ./services/payment-service

                    - name: product-service
                      context: ./services/product-service

                    - name: review-service
                      context: ./services/review-service

                    - name: saga-service
                      context: ./services/saga-service

                    - name: user-service
                      context: ./services/user-service

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.name }}-jar
                  path: ${{ matrix.context }}/target

            - name: Image prefix to lowercase
              id: prep
              run: echo "IMAGE_PREFIX_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Log in to Github Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}
                  tags: |
                      type=sha,prefix=develop-
                      type=raw,value=develop-latest
                      type=raw,value=develop-${{ github.run_number }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ${{ matrix.context }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/${{ matrix.name }}:buildcache,mode=max

    build-and-push-keycloak:
        runs-on: ubuntu-latest
        needs:
            - detect-changes
            - build-keycloak-spi
        if: |
            github.event_name == 'push' &&
            (contains(needs.detect-changes.outputs.services, 'kafka-keycloak-spi') ||
            contains(needs.detect-changes.outputs.services, 'all'))

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create keycloak directory
              run: mkdir -p ./keycloak

            - name: Download SPI artifact
              uses: actions/download-artifact@v4
              with:
                  name: keycloak-spi-jar
                  path: ./keycloak/

            - name: Image prefix to lowercase
              id: prep
              run: echo "IMAGE_PREFIX_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Log in to Github Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/keycloak
                  tags: |
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest
                      type=semver,pattern={{version}}

            - name: Build and push Keycloak image
              uses: docker/build-push-action@v5
              with:
                  context: ./keycloak/
                  file: ./keycloak/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/keycloak:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}/keycloak:buildcache,mode=max
