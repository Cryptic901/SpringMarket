server:
  port: 8080
eureka:
  instance:
    hostname: gateway
    prefer-ip-address: false
spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://keycloak:8080/realms/springmarket/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/springmarket/protocol/openid-connect/token
            user-info-uri: http://keycloak:8080/realms/springmarket/protocol/openid-connect/userinfo
            jwk-set-uri: http://keycloak:8080/realms/springmarket/protocol/openid-connect/certs

        registration:
          keycloak:
            client-id: api-gateway
            client-secret: ZxR7Gdhbt0apBewaZnZX3oZN4rybsnFc
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  cloud:
    discovery:
      enabled: true
    gateway:
      routes:
        - id: product-routes
          uri: lb://PRODUCTSERVICE
          predicates:
            - Path=/api/v1/products/**
          filters:
            - TokenRelay

        - id: category-routes
          uri: lb://CATEGORYSERVICE
          predicates:
            - Path=/api/v1/categories/**
          filters:
            - TokenRelay

        - id: order-routes
          uri: lb://ORDERSERVICE
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - TokenRelay

        - id: inventory-routes
          uri: lb://INVENTORYSERVICE
          predicates:
            - Path=/api/v1/inventories/**
          filters:
            - TokenRelay

        - id: review-routes
          uri: lb://REVIEWSERVICE
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - TokenRelay

        - id: user-routes
          uri: lb://USERSERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - TokenRelay

        - id: payment-routes
          uri: lb://PAYMENTSERVICE
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - TokenRelay

        - id: notification-routes
          uri: lb://NOTIFICATIONSERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - TokenRelay

        - id: analytic-routes
          uri: lb://ANALYTICSERVICE
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - TokenRelay

        - id: cart-routes
          uri: lb://CARTSERVICE
          predicates:
            - Path=/api/v1/carts/**
          filters:
            - TokenRelay

        - id: keycloak-routes
          uri: http://keycloak:8080
          predicates:
            - Path=/realms/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true