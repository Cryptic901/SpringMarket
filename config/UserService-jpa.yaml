spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/user_db
    username: user_service
    password: user_pass

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    schemas: user_schema
    default-schema: user_schema
    enabled: true
    baseline-on-migrate: true