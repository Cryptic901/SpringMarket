apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: database
  labels:
    app: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - image: mongo:8.2.1

          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5

          name: mongo
          ports:
            - containerPort: 27017
              protocol: TCP

          volumeMounts:
            - mountPath: /data/db
              name: mongo-data

          resources:
            requests:
              memory: "356Mi"
              cpu: "250m"
            limits:
              memory: "700Mi"
              cpu: "450m"

      restartPolicy: Always

  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: standard
