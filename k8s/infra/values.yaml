namespace: infra
controller:
  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  config:
    proxy-connect-timeout: "30"
    proxy-read-timeout: "30"
    proxy-send-timeout: "30"

  service:
    type: LoadBalancer

  podLabels:
    app: ingress-nginx
    environment: dev

defaultBackend:
  enabled: true