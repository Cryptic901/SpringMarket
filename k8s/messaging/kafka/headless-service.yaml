apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: messaging
  labels:
    app: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - port: 9090
      targetPort: 9090
      name: client
    - port: 9091
      targetPort: 9091
      name: controller