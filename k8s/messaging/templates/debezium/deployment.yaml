{{- $service := .Values.messaging.services.debezium }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: {{ .Values.namespace }}
  labels:
    app: debezium
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: debezium
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: debezium
    spec:
      containers:
        - env:
            - name: BOOTSTRAP_SERVERS
              value: kafka-0.kafka-headless.{{ .Values.namespace }}.svc.cluster.local:9090,kafka-1.kafka-headless.{{ .Values.namespace }}.svc.cluster.local:9090,kafka-2.kafka-headless.{{ .Values.namespace }}.svc.cluster.local:9090
            - name: CONFIG_STORAGE_TOPIC
              value: "kafka-connect-config"
            - name: GROUP_ID
              value: "1"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: OFFSET_STORAGE_TOPIC
              value: "kafka-connect-offset"
            - name: REST_PORT
              value: "{{ $service.targetPort }}"
            - name: STATUS_STORAGE_TOPIC
              value: "kafka-connect-status"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"

          image: debezium/connect:2.7.3.Final
          livenessProbe:
            httpGet:
              port: {{ $service.targetPort }}
              path: /connectors
            failureThreshold: 5
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          name: debezium
          ports:
            - containerPort: {{ $service.targetPort }}
              protocol: TCP
          volumeMounts:
            - mountPath: /debezium
              name: debezium-data

            - mountPath: /docker-entrypoint-init.d
              name: debezium-config

          resources:
            requests:
              memory: {{ $service.resources.requests.memory }}
              cpu: {{ $service.resources.requests.cpu }}
            limits:
              memory: {{ $service.resources.limits.memory }}
              cpu: {{ $service.resources.limits.cpu }}

        - name: connector-registrar
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka Connect API..."
              while ! curl -s http://localhost:8083/ >/dev/null 2>&1; do
                sleep 5
              done

              echo "Kafka Connect is ready, registering connectors..."

              # Регистрация каждого коннектора
              for config_file in /configs/*.json; do
                connector_name=$(basename "$config_file" .json | sed 's/debezium-//' | sed 's/-postgres-connector//')
                echo "Registering connector from $config_file..."

                # Проверить, существует ли коннектор
                if curl -s http://localhost:8083/connectors | grep -q "\"${connector_name}-outbox-connector\""; then
                  echo "Connector ${connector_name}-outbox-connector already exists, updating..."
                  curl -X PUT \
                    -H "Content-Type: application/json" \
                    --data @"$config_file" \
                    http://localhost:8083/connectors/${connector_name}-outbox-connector/config
                else
                  echo "Creating new connector ${connector_name}-outbox-connector..."
                  curl -X POST \
                    -H "Content-Type: application/json" \
                    --data @"$config_file" \
                    http://localhost:8083/connectors
                fi

                echo "Connector ${connector_name} registered"
                sleep 2
              done

              echo "All connectors registered, starting monitoring loop..."

              # Мониторинг и перезапуск failed коннекторов
              while true; do
                sleep 60
                for connector in $(curl -s http://localhost:8083/connectors); do
                  connector_clean=$(echo $connector | tr -d '[]," ')
                  if [ ! -z "$connector_clean" ]; then
                    status=$(curl -s http://localhost:8083/connectors/$connector_clean/status | grep -o '"state":"[^"]*"' | head -1 | cut -d'"' -f4)
                    if [ "$status" = "FAILED" ]; then
                      echo "Connector $connector_clean is FAILED, restarting..."
                      curl -X POST http://localhost:8083/connectors/$connector_clean/restart
                    fi
                  fi
                done
              done
          volumeMounts:
          - mountPath: /configs
            name: debezium-config
            readOnly: true
      hostname: debezium
      restartPolicy: Always
      volumes:
        - name: debezium-data
          persistentVolumeClaim:
            claimName: debezium-data

        - name: debezium-config
          configMap:
            name: debezium-config

