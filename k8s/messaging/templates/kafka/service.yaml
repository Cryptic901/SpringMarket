apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.messaging.services.kafka.clientPort }}
      targetPort: {{ .Values.messaging.services.kafka.clientTargetPort }}
  selector:
    app: kafka
