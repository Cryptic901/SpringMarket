apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-loki
  namespace: observability
  labels:
    app: grafana-loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana-loki
  template:
    metadata:
      labels:
        app: grafana-loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - image: grafana/loki:3.5
          livenessProbe:
            httpGet:
              port: 3100
              path: /ready
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              port: 3100
              path: /ready
            initialDelaySeconds: 10
            periodSeconds: 5

          name: grafana-loki
          ports:
            - containerPort: 3100
              protocol: TCP
          args:
            - -config.file=/etc/loki/loki-config.yaml
          volumeMounts:
            - mountPath: /loki
              name: loki-data
            - mountPath: /etc/loki/loki-config.yaml
              name: loki-config
              readOnly: true
              subPath: loki-config.yaml

          resources:
            requests:
              memory: "500Mi"
              cpu: "150m"
            limits:
              memory: "700Mi"
              cpu: "500m"

      restartPolicy: Always

      volumes:
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data

        - name: loki-config
          configMap:
            name: grafana-loki-config
            items:
              - key: loki-config.yaml
                path: loki-config.yaml

