apiVersion: v1
kind: Service
metadata:
  labels:
    app: grafana-tempo
  name: grafana-tempo
  namespace: observability
spec:
  ports:
    - name: grafana
      port: 3200
      targetPort: 3200
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
  selector:
    app: grafana-tempo
