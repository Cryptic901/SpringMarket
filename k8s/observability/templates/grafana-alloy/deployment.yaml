{{- $service := index .Values.observability.services "grafana-alloy" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana-alloy
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          image: grafana/alloy:latest
          livenessProbe:
            exec:
              command:
                - pgrep
                - alloy
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - pgrep
                - alloy
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5

          name: grafana-alloy
          ports:
            - containerPort: {{ index $service "targetPort" }}
              protocol: TCP
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /etc/alloy/config.alloy
              name: grafana-alloy-config
              readOnly: true
              subPath: config.alloy

          resources:
            requests:
              memory: {{ index $service "resources" "requests" "memory" }}
              cpu: {{ index $service "resources" "requests" "cpu" }}
            limits:
              memory: {{ index $service "resources" "limits" "memory" }}
              cpu: {{ index $service "resources" "limits" "cpu" }}

      restartPolicy: Always
      volumes:
        - name: grafana-alloy-config
          configMap:
            name: grafana-alloy-config
            items:
              - key: config.alloy
                path: config.alloy

