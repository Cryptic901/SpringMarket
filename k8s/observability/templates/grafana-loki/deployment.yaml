{{- $service := index .Values.observability.services "grafana-loki" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-loki
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana-loki
spec:
  replicas: {{ index $service "replicaCount" }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana-loki
  template:
    metadata:
      labels:
        app: grafana-loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - image: grafana/loki:3.5
          livenessProbe:
            httpGet:
              port: {{ index $service "targetPort" }}
              path: /ready
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              port: {{ index $service "targetPort" }}
              path: /ready
            initialDelaySeconds: 10
            periodSeconds: 5

          name: grafana-loki
          ports:
            - containerPort: {{ index $service "targetPort" }}
              protocol: TCP
          args:
            - -config.file=/etc/loki/loki-config.yaml
          volumeMounts:
            - mountPath: /loki
              name: loki-data
            - mountPath: /etc/loki/loki-config.yaml
              name: loki-config
              readOnly: true
              subPath: loki-config.yaml

          resources:
            requests:
              memory: {{ index $service "resources" "requests" "memory" }}
              cpu: {{ index $service "resources" "requests" "cpu" }}
            limits:
              memory: {{ index $service "resources" "limits" "memory" }}
              cpu: {{ index $service "resources" "limits" "cpu" }}

      restartPolicy: Always

      volumes:
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data

        - name: loki-config
          configMap:
            name: grafana-loki-config
            items:
              - key: loki-config.yaml
                path: loki-config.yaml

