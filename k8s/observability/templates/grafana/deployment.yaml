{{- $service := .Values.observability.services.grafana }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
spec:
  replicas: {{ $service.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: "*"
            - name: GF_SERVER_ROOT_URL
              value: "http://monitoring.local/"

          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ $service.targetPort }}
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ $service.targetPort }}
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          resources:
            requests:
              memory: {{ $service.resources.requests.memory }}
              cpu: {{ $service.resources.requests.cpu }}
            limits:
              memory: {{ $service.resources.limits.memory }}
              cpu: {{ $service.resources.limits.cpu }}

          ports:
            - containerPort: {{ $service.targetPort }}
              protocol: TCP

          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-data

      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data

