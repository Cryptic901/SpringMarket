apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: cart-service
  name: cart-service-configmap
  namespace: spring-market
data:
  CartService-dev.yaml: |-
    server:
      port: 8084
      shutdown: graceful

    springdoc:
      api-docs:
        path: /cart-service/v3/api-docs
      swagger-ui:
        path: /cart-service/swagger-ui.html
  CartService-eureka.yaml: |-
    eureka:
      instance:
        hostname: cart-service
        prefer-ip-address: false
  CartService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/cart_db
        username: cart_service
        password: cart_pass
      jpa:
        hibernate:
          ddl-auto: update
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
      flyway:
        schemas: cart_schema
        default-schema: cart_schema
        enabled: true
        baseline-on-migrate: true
  CartService-kafka.yaml: |-
    spring:
      kafka:
        bootstrap-servers: kafka.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: analytic-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: cart-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: cart-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  CartService-mongo.yaml: |-
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/cartDB
  CartService.yaml: |-
    server:
      port: 8084
      shutdown: graceful

    springdoc:
      api-docs:
        path: /cart-service/v3/api-docs
      swagger-ui:
        path: /cart-service/swagger-ui.html