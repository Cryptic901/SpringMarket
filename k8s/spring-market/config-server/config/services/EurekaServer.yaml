apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: eureka-server
  name: eureka-server-configmap
  namespace: spring-market
data:
  EurekaServer-dev.yaml: |
    server:
      port: 8761
      shutdown: graceful
    eureka:
      instance:
        hostname: eureka-server
        prefer-ip-address: false
      client:
        register-with-eureka: false
        fetch-registry: false
  EurekaServer.yaml: |-
    server:
      port: 8761
      shutdown: graceful
    eureka:
      instance:
        hostname: eureka-server
        prefer-ip-address: false
      client:
        register-with-eureka: false
        fetch-registry: false