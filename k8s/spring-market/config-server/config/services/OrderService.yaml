apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: order-service
  name: order-service-configmap
  namespace: spring-market
data:
  OrderService-dev.yaml: |-
    server:
      port: 8082
      shutdown: graceful

    springdoc:
      api-docs:
        path: /order-service/v3/api-docs
      swagger-ui:
        path: /order-service/swagger-ui.html
  OrderService-eureka.yaml: |-
    eureka:
      instance:
        hostname: order-service
        prefer-ip-address: false
  OrderService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/order_db
        username: order_service
        password: order_pass
      flyway:
        schemas: order_schema
        default-schema: order_schema
        enabled: true
        baseline-on-migrate: true
      jpa:
        hibernate:
          ddl-auto: update
          dialect: org.hibernate.spatial.dialect.postgis.PostgisPG17Dialect
  OrderService-kafka.yaml: |-
    spring:
      kafka:
        bootstrap-servers: kafka-0.kafka-headless.messaging.svc.cluster.local:9090,kafka-1.kafka-headless.messaging.svc.cluster.local:9090,kafka-2.kafka-headless.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: order-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: order-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: order-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  OrderService-mongo.yaml: |-
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/orderDB
  OrderService.yaml: |-
    server:
      port: 8082
      shutdown: graceful

    springdoc:
      api-docs:
        path: /order-service/v3/api-docs
      swagger-ui:
        path: /order-service/swagger-ui.html