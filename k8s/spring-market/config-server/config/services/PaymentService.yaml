apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: payment-service
  name: payment-service-configmap
  namespace: spring-market
data:
  PaymentService-dev.yaml: |+
    server:
      port: 8088
      shutdown: graceful

    springdoc:
      api-docs:
        path: /payment-service/v3/api-docs
      swagger-ui:
        path: /payment-service/swagger-ui.html

    stripe:
      secret:
        key: ${STRIPE_SECRET_KEY}

  PaymentService-eureka.yaml: |-
    eureka:
      instance:
        hostname: payment-service
        prefer-ip-address: false
  PaymentService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/payment_db
        username: payment_service
        password: payment_pass
      jpa:
        hibernate:
          ddl-auto: update
      flyway:
        schemas: payment_schema
        default-schema: payment_schema
        enabled: true
        baseline-on-migrate: true
  PaymentService-kafka.yaml: |-
    spring:
      kafka:
        bootstrap-servers: kafka-0.kafka-headless.messaging.svc.cluster.local:9090,kafka-1.kafka-headless.messaging.svc.cluster.local:9090,kafka-2.kafka-headless.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: payment-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: payment-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: payment-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  PaymentService-mongo.yaml: |-
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/paymentDB
  PaymentService.yaml: |+
    server:
      port: 8088
      shutdown: graceful

    springdoc:
      api-docs:
        path: /payment-service/v3/api-docs
      swagger-ui:
        path: /payment-service/swagger-ui.html

    stripe:
      secret:
        key: ${STRIPE_SECRET_KEY}