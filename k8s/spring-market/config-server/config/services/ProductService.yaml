apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: product-service
  name: product-service-configmap
  namespace: spring-market
data:
  ProductService-dev.yaml: |-
    server:
      port: 8081
      shutdown: graceful

    springdoc:
      api-docs:
        path: /product-service/v3/api-docs
      swagger-ui:
        path: /product-service/swagger-ui.html
  ProductService-eureka.yaml: |-
    eureka:
      instance:
        hostname: product-service
        prefer-ip-address: false
  ProductService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/product_db
        username: product_service
        password: product_pass
      flyway:
        schemas: product_schema
        default-schema: product_schema
        enabled: true
        baseline-on-migrate: true
      jpa:
        hibernate:
          ddl-auto: update
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            jdbc:
              batch_size: 50
            order_updates: true
            order_inserts: true
  ProductService-kafka.yaml: |-
    spring:
      kafka:
        bootstrap-servers: kafka.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: product-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        retry:
          topic:
            attempts: 5
        topics:
          name: product-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: product-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  ProductService-mongo.yaml: |-
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/productDB
  ProductService.yaml: |-
    server:
      port: 8081
      shutdown: graceful

    springdoc:
      api-docs:
        path: /product-service/v3/api-docs
      swagger-ui:
        path: /product-service/swagger-ui.html