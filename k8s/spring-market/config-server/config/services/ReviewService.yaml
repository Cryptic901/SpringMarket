apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: review-service
  name: review-service-configmap
  namespace: spring-market
data:
  ReviewService-dev.yaml: |-
    server:
      port: 8083
      shutdown: graceful

    springdoc:
      api-docs:
        path: /review-service/v3/api-docs
      swagger-ui:
        path: /review-service/swagger-ui.html
  ReviewService-eureka.yaml: |-
    eureka:
      instance:
        hostname: review-service
        prefer-ip-address: false
  ReviewService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/review_db
        username: review_service
        password: review_pass
      jpa:
        hibernate:
          ddl-auto: update
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
      flyway:
        schemas: review_schema
        default-schema: review_schema
        enabled: true
        baseline-on-migrate: true
  ReviewService-kafka.yaml: |
    spring:
      kafka:
        bootstrap-servers: kafka-0.kafka-headless.messaging.svc.cluster.local:9090,kafka-1.kafka-headless.messaging.svc.cluster.local:9090,kafka-2.kafka-headless.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: review-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: review-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: review-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  ReviewService-mongo.yaml: |
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/reviewDB
  ReviewService.yaml: |-
    server:
      port: 8083
      shutdown: graceful

    springdoc:
      api-docs:
        path: /review-service/v3/api-docs
      swagger-ui:
        path: /review-service/swagger-ui.html