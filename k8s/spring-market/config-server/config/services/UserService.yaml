apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: user-service
  name: user-service-configmap
  namespace: spring-market
data:
  UserService-dev.yaml: |-
    server:
      port: 8086
      shutdown: graceful

    springdoc:
      api-docs:
        path: /user-service/v3/api-docs
      swagger-ui:
        path: /user-service/swagger-ui.html
  UserService-eureka.yaml: |-
    eureka:
      instance:
        hostname: user-service
        prefer-ip-address: false
  UserService-jpa.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/user_db
        username: user_service
        password: user_pass

      jpa:
        hibernate:
          ddl-auto: update
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect

      flyway:
        schemas: user_schema
        default-schema: user_schema
        enabled: true
        baseline-on-migrate: true
  UserService-kafka.yaml: |
    spring:
      kafka:
        bootstrap-servers: kafka.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: user-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: user-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: user-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
  UserService-mongo.yaml: |
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/userDB
  UserService.yaml: |-
    server:
      port: 8086
      shutdown: graceful

    springdoc:
      api-docs:
        path: /user-service/v3/api-docs
      swagger-ui:
        path: /user-service/swagger-ui.html