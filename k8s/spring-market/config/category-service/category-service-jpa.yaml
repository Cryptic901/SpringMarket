apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: category-service
  name: category-service-jpa
  namespace: spring-market
data:
  application.yaml: |-
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/category_db
        username: category_service
        password: category_pass

      jpa:
        enabled: true
        hibernate:
          ddl-auto: update

      flyway:
        schemas: category_schema
        default-schema: category_schema
        enabled: true
        baseline-on-migrate: true