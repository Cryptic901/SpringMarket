apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: inventory-service
  name: inventory-service-dev
  namespace: spring-market
data:
  application.yaml: |-
    spring:
      data:
        mongodb:
          uri: mongodb://mongo.database.svc.cluster.local:27017/inventoryDB
      kafka:
        bootstrap-servers: kafka-0.kafka-headless.messaging.svc.cluster.local:9090,kafka-1.kafka-headless.messaging.svc.cluster.local:9090,kafka-2.kafka-headless.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: inventory-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: inventory-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: inventory-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/inventory_db
        username: inventory_service
        password: inventory_pass

      flyway:
        schemas: inventory_schema
        default-schema: inventory_schema
        enabled: true
        baseline-on-migrate: true
      jpa:
        hibernate:
          ddl-auto: update
          dialect: org.hibernate.spatial.dialect.postgis.PostgisPG17Dialect
          
    server:
      port: 8087
      shutdown: graceful

    springdoc:
      api-docs:
        path: /inventory-service/v3/api-docs
      swagger-ui:
        path: /inventory-service/swagger-ui.html