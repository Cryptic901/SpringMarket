apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: order-service
  name: order-service
  namespace: spring-market
data:
  application.yaml: |-
    server:
      port: 8082
      shutdown: graceful

    springdoc:
      api-docs:
        path: /order-service/v3/api-docs
      swagger-ui:
        path: /order-service/swagger-ui.html