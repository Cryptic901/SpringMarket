apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: payment-service
  name: payment-service-jpa
  namespace: spring-market
data:
  application.yaml: |
    spring:
      datasource:
        url: jdbc:postgresql://postgres.database.svc.cluster.local:5432/payment_db
        username: payment_service
        password: payment_pass
        driver-class-name: org.postgresql.Driver
      jpa:
        enabled: true
        hibernate:
          ddl-auto: update
      flyway:
        schemas: payment_schema
        default-schema: payment_schema
        enabled: true
        baseline-on-migrate: true