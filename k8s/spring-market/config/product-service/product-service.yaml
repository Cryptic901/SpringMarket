apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: product-service
    environment: default
  name: product-service-config
  namespace: spring-market
data:
  application.yaml: |-
    server:
      port: 8081
      shutdown: graceful

    springdoc:
      api-docs:
        path: /product-service/v3/api-docs
      swagger-ui:
        path: /product-service/swagger-ui.html