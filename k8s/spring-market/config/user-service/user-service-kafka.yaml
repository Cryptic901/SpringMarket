apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: user-service
  name: user-service-dev
  namespace: spring-market
data:
  application.yaml: |-
    spring:
      kafka:
        enabled: true
        bootstrap-servers: kafka-0.kafka-headless.messaging.svc.cluster.local:9090,kafka-1.kafka-headless.messaging.svc.cluster.local:9090,kafka-2.kafka-headless.messaging.svc.cluster.local:9090
        consumer:
          auto-offset-reset: earliest
          group-id: user-consumer-group
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.json.trusted.packages: by.cryptic.*
            spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.value.default.type: by.cryptic.utils.event.DomainEvent
            spring.json.use.type.headers: false
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        listener:
          missing-topics-fatal: false
        topics:
          name: user-topic
          partitions: 3
          replicas: 3
          minInsyncReplicas: 1
          dlq:
            name: user-topic.DLQ
            partitions: 3
            replicas: 3
            minInsyncReplicas: 1