scrape_configs:
  - job_name: application
    static_configs:
      - targets:
          - "eureka-server:8761"
          - "gateway:8080"
          - "analytic-service:8085"
          - "cart-service:8084"
          - "category-service:8091"
          - "inventory-service:8087"
          - "notification-service:8089"
          - "order-service:8082"
          - "payment-service:8088"
          - "product-service:8081"
          - "review-service:8083"
          - "saga-service:8090"
          - "user-service:8086"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
