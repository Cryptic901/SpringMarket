spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: analytic-service
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config

          - namespace: spring-market
            name: analytic-service

          - namespace: spring-market
            name: analytic-service-cache

          - namespace: spring-market
            name: analytic-service-kafka

          - namespace: spring-market
            name: analytic-service-security

