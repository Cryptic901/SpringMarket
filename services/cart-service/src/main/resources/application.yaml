spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: cart-service
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config

          - namespace: spring-market
            name: cart-service

          - namespace: spring-market
            name: cart-service-cache

          - namespace: spring-market
            name: cart-service-kafka

          - namespace: spring-market
            name: cart-service-security

          - namespace: spring-market
            name: cart-service-feign

          - namespace: spring-market
            name: cart-service-jpa

          - namespace: spring-market
            name: cart-service-mongo