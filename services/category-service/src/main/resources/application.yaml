spring:
  config:
    import: "optional:kubernetes:
  application:
    name: category-service
  profiles:
    group:
      dev: "security,kafka,cache,jpa,mongo"
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config-dev

          - namespace: spring-market
            name: category-service-dev

          - namespace: spring-market
            name: category-service-cache

          - namespace: spring-market
            name: category-service-kafka

          - namespace: spring-market
            name: category-service-security

          - namespace: spring-market
            name: category-service-jpa

          - namespace: spring-market
            name: category-service-mongo