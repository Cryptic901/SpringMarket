spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: gateway
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        include-profile-specific-sources: false
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config-dev

          - namespace: spring-market
            name: gateway-dev



