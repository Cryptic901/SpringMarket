spring:
  application:
    name: gateway
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config
          - namespace: spring-market
            name: common-config-${spring.profiles.active}
          - namespace: spring-market
            name: gateway
          - namespace: spring-market
            name: gateway-${spring.profiles.active}



