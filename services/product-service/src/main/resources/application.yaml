spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: product-service
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        include-profile-specific-sources: false
        sources:
          - namespace: spring-market
            name: common-config

          - namespace: spring-market
            name: product-service

          - namespace: spring-market
            name: product-service-cache

          - namespace: spring-market
            name: product-service-kafka

          - namespace: spring-market
            name: product-service-security

          - namespace: spring-market
            name: product-service-feign

          - namespace: spring-market
            name: product-service-jpa

          - namespace: spring-market
            name: product-service-mongo
