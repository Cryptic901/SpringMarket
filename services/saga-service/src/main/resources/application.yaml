spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: saga-service
  profiles:
    group:
      dev: "security,kafka"
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config
          - namespace: spring-market
            name: common-config-${spring.profiles.active}
          - namespace: spring-market
            name: saga-service
          - namespace: spring-market
            name: saga-service-${spring.profiles.active}

