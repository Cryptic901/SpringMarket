spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: user-service
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config

          - namespace: spring-market
            name: user-service

          - namespace: spring-market
            name: user-service-cache

          - namespace: spring-market
            name: user-service-jpa

          - namespace: spring-market
            name: user-service-mongo

          - namespace: spring-market
            name: user-service-kafka

          - namespace: spring-market
            name: user-service-security


