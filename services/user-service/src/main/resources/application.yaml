spring:
  config:
    import: "optional:kubernetes:"
  application:
    name: user-service
  profiles:
    group:
      dev: "security,kafka,cache,jpa,mongo"
  cloud:
    kubernetes:
      reload:
        enabled: true
        mode: polling
        period: 5000
      config:
        include-profile-specific-sources: false
        enabled: true
        sources:
          - namespace: spring-market
            name: common-config-dev

          - namespace: spring-market
            name: user-service-dev

          - namespace: spring-market
            name: user-service-cache

          - namespace: spring-market
            name: user-service-jpa

          - namespace: spring-market
            name: user-service-mongo

          - namespace: spring-market
            name: user-service-kafka

          - namespace: spring-market
            name: user-service-security


